<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iWaitX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #000000;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.75);
      --text-muted: rgba(255, 255, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Cairo', 'Inter', sans-serif;
      overflow: hidden;
    }

    /* =========================================
       1. SPLASH SCREEN ("Click to Enter")
       ========================================= */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      animation: pulseText 2.2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* =========================================
       2. FULLSCREEN BACKGROUND VIDEO (بدون حواف)
       ========================================= */
    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* يملأ الشاشة بالكامل ويقص الأطراف الزائدة لمنع أي حواف سوداء */
      filter: grayscale(100%) contrast(1.2) brightness(0.4);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.02);
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.65) 80%, rgba(0, 0, 0, 0.9) 100%);
      pointer-events: none;
    }

    /* Canvas للورود المتساقطة */
    #rose-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* زر كتم الصوت أعلى اليسار */
    #mute-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      outline: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    #mute-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: scale(1.08);
    }

    #mute-btn svg {
      width: 20px;
      height: 20px;
    }

    /* =========================================
       3. PROFILE CONTAINER (بدون خلفيات مربعة)
       ========================================= */
    .main-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 120px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                  transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }

    .main-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .profile-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.7));
      animation: avatarPulse 3.2s infinite ease-in-out;
      margin-bottom: 20px;
    }

    @keyframes avatarPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.25), 0 0 40px rgba(255, 255, 255, 0.1); }
      50% { box-shadow: 0 0 35px rgba(255, 255, 255, 0.5), 0 0 70px rgba(255, 255, 255, 0.2); }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .display-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
      line-height: 1.15;
    }

    .bio-status {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .location-badge svg {
      width: 14px;
      height: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* =========================================
       4. SOCIAL ICONS
       ========================================= */
    .socials-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
    }

    .social-link {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.28s ease,
                  box-shadow 0.28s ease;
    }

    .social-link svg {
      width: 24px;
      height: 24px;
      transition: filter 0.28s ease;
    }

    .social-link:hover {
      transform: translateY(-5px) scale(1.12);
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .social-link:hover svg {
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
    }

    /* =========================================
       5 & 6. BOTTOM MUSIC PLAYER & STATS
       ========================================= */
    .bottom-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      width: calc(100% - 32px);
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .metrics-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(12, 12, 16, 0.65);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .metrics-pill svg {
      width: 14px;
      height: 14px;
    }

    .music-player {
      width: 100%;
      padding: 12px 16px;
      border-radius: 20px;
      background: rgba(10, 10, 14, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .album-art {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .track-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.08);
    }

    .ctrl-btn.play-pause-btn {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .ctrl-btn.play-pause-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .ctrl-btn svg {
      width: 16px;
      height: 16px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      min-width: 34px;
    }

    .time-label.end {
      text-align: right;
    }

    .progress-bar-container {
      position: relative;
      flex: 1;
      height: 14px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: width 0.08s linear;
    }

    @media (max-width: 480px) {
      .display-name { font-size: 1.9rem; }
      .avatar-wrapper { width: 105px; height: 105px; }
      #mute-btn { top: 16px; left: 16px; }
      .bottom-dock { bottom: 16px; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       1. SPLASH SCREEN ("اضغط هنا")
       ========================================================= -->
  <div id="splash-screen">
    <span class="splash-text">دوس هنا...</span>
  </div>

  <!-- =========================================================
       2. FULLSCREEN BACKGROUND VIDEO
       ========================================================= -->
  <div class="bg-wrapper">
    <video id="bg-video" autoplay muted loop playsinline>
      <source src="background.mp4" type="video/mp4" />
    </video>
    <div class="bg-vignette"></div>
  </div>

  <!-- Canvas للورود المتساقطة -->
  <canvas id="rose-canvas"></canvas>

  <!-- BACKGROUND AUDIO SOURCE -->
  <audio id="bg-audio" preload="metadata" loop>
    <source src="red.mp4" type="audio/mp4" />
  </audio>

  <!-- Mute Toggle -->
  <button id="mute-btn" aria-label="Toggle Mute" title="كتم / إلغاء الكتم">
    <svg id="icon-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <svg id="icon-muted" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <!-- =========================================================
       3 & 4. PROFILE & SOCIALS
       ========================================================= -->
  <main class="main-container" id="main-content">
    <div class="profile-wrapper">
      <div class="avatar-wrapper">
        <img src="avatar.png" alt="iWaitX Avatar" class="avatar-img" />
      </div>

      <h1 class="display-name">iWaitX</h1>
      <p class="bio-status">صانع محتوى عراقي لكن (راقي)</p>

      <div class="location-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>العراق🇮🇶</span>
      </div>

      <div class="socials-row">
        <!-- TikTok -->
        <a href="https://www.tiktok.com/@iwaitx" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="TikTok" title="TikTok">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
          </svg>
        </a>

        <!-- Discord -->
        <a href="https://discord.gg/zKTY4dYvtn" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Discord" title="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com/@iWaitX" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="YouTube" title="YouTube">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>
      </div>
    </div>
  </main>

  <!-- =========================================================
       5 & 6. BOTTOM DOCK
       ========================================================= -->
  <div class="bottom-dock">
    <div class="metrics-pill" title="مشاهدات الملف الشخصي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span id="view-count">15,420</span>
    </div>

    <div class="music-player">
      <div class="player-top-row">
        <div class="track-info">
          <img src="8eaabe8d-66da-439b-ae69-d028140a2702.webp" alt="Album Art" class="album-art" />
          <div class="track-details">
            <span class="track-title" id="track-title">iWaitX — Ambient Theme</span>
            <span class="track-artist">iWaitX Official</span>
          </div>
        </div>

        <div class="player-controls">
          <button class="ctrl-btn" id="prev-btn" title="السابق">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="تشغيل / إيقاف">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" style="display: none;" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="ctrl-btn" id="next-btn" title="التالي">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>

      <div class="progress-row">
        <span class="time-label" id="current-time">0:00</span>
        <div class="progress-bar-container" id="progress-container">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <span class="time-label end" id="total-time">0:00</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const splashScreen = document.getElementById('splash-screen');
      const mainContent = document.getElementById('main-content');
      const bgVideo = document.getElementById('bg-video');
      const bgAudio = document.getElementById('bg-audio');

      const muteBtn = document.getElementById('mute-btn');
      const iconUnmuted = document.getElementById('icon-unmuted');
      const iconMuted = document.getElementById('icon-muted');

      const playPauseBtn = document.getElementById('play-pause-btn');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');

      const progressContainer = document.getElementById('progress-container');
      const progressFill = document.getElementById('progress-fill');
      const currentTimeEl = document.getElementById('current-time');
      const totalTimeEl = document.getElementById('total-time');
      const viewCountEl = document.getElementById('view-count');

      let views = parseInt(localStorage.getItem('iwaitx_views') || '15420', 10) + 1;
      localStorage.setItem('iwaitx_views', views);
      viewCountEl.textContent = views.toLocaleString();

      bgAudio.volume = 0.7;

      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      function updatePlayState(isPlaying) {
        if (isPlaying) {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
        } else {
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        }
      }

      function updateMuteState() {
        if (bgAudio.muted || bgAudio.volume === 0) {
          iconUnmuted.style.display = 'none';
          iconMuted.style.display = 'block';
        } else {
          iconUnmuted.style.display = 'block';
          iconMuted.style.display = 'none';
        }
      }

      splashScreen.addEventListener('click', () => {
        splashScreen.classList.add('hidden');
        mainContent.classList.add('visible');
        bgVideo.play().catch(() => {});
        bgAudio.play().then(() => updatePlayState(true)).catch(() => updatePlayState(false));
      });

      muteBtn.addEventListener('click', () => {
        bgAudio.muted = !bgAudio.muted;
        updateMuteState();
      });

      playPauseBtn.addEventListener('click', () => {
        if (bgAudio.paused) {
          bgAudio.play().then(() => updatePlayState(true));
        } else {
          bgAudio.pause();
          updatePlayState(false);
        }
      });

      prevBtn.addEventListener('click', () => { bgAudio.currentTime = 0; });
      nextBtn.addEventListener('click', () => {
        if (bgAudio.duration) {
          bgAudio.currentTime = Math.min(bgAudio.duration, bgAudio.currentTime + 10);
        }
      });

      bgAudio.addEventListener('loadedmetadata', () => {
        totalTimeEl.textContent = formatTime(bgAudio.duration);
      });

      bgAudio.addEventListener('timeupdate', () => {
        if (!bgAudio.duration) return;
        const percent = (bgAudio.currentTime / bgAudio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(bgAudio.currentTime);
      });

      let isScrubbing = false;
      function scrub(e) {
        if (!bgAudio.duration) return;
        const rect = progressContainer.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clickX = Math.max(0, Math.min(clientX - rect.left, rect.width));
        const ratio = clickX / rect.width;
        bgAudio.currentTime = ratio * bgAudio.duration;
        progressFill.style.width = `${ratio * 100}%`;
      }

      progressContainer.addEventListener('mousedown', (e) => { isScrubbing = true; scrub(e); });
      window.addEventListener('mousemove', (e) => { if (isScrubbing) scrub(e); });
      window.addEventListener('mouseup', () => { isScrubbing = false; });
      progressContainer.addEventListener('touchstart', (e) => { isScrubbing = true; scrub(e); }, { passive: true });
      window.addEventListener('touchmove', (e) => { if (isScrubbing) scrub(e); }, { passive: true });
      window.addEventListener('touchend', () => { isScrubbing = false; });

      // Roses Animation
      const canvas = document.getElementById('rose-canvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      class RosePetal {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = -20;
          this.size = Math.random() * 8 + 6;
          this.speedY = Math.random() * 1.2 + 0.6;
          this.speedX = Math.random() * 1 - 0.5;
          this.rotation = Math.random() * 360;
          this.rotSpeed = Math.random() * 2 - 1;
          this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX + Math.sin(this.y * 0.02) * 0.4;
          this.rotation += this.rotSpeed;
          if (this.y > canvas.height + 20) this.reset();
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.globalAlpha = this.opacity;
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      }

      const petals = Array.from({ length: 18 }, () => new RosePetal());
      function animatePetals() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        petals.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animatePetals);
      }
      animatePetals();
    });
  </script>
</body>
</html>
