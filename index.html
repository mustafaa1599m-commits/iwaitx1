<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iWaitX</title>
<meta name="theme-color" content="#050403">
<link rel="icon" href="avatar.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS — الألوان (ذهبي شامبين على أسود)
   ═══════════════════════════════════════════════════════════════ */
:root{
  --gold-1:#8f6b2e;
  --gold-2:#d4af61;
  --gold-3:#f3dca0;
  --gold-4:#fff6dc;
  --gold:#e6c77a;
  --gold-rgb:230,199,122;
  --ink:#050403;
  --text:#faf6ee;
  --text-2:rgba(250,246,238,.74);
  --text-3:rgba(250,246,238,.44);
  --glass:rgba(10,8,6,.55);
  --line:rgba(var(--gold-rgb),.16);
  --ease:cubic-bezier(.16,1,.3,1);
  --f-ar:"Cairo","Inter",system-ui,sans-serif;
  --f-en:"Inter","Cairo",system-ui,sans-serif;
  --f-display:"Cormorant Garamond","Cairo",Georgia,serif;
  --mx:50%; --my:40%;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ width:100%; height:100%; background:var(--ink); color:var(--text); font-family:var(--f-ar); overflow:hidden; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
img{ -webkit-user-drag:none; user-select:none; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:10px; }
svg{ display:block; }

/* ═══════════════════════════════════════════════════════════════
   1 · SPLASH
   ═══════════════════════════════════════════════════════════════ */
#splash{
  position:fixed; inset:0; z-index:9999; display:grid; place-items:center; cursor:pointer;
  background:radial-gradient(ellipse at 50% 50%, #0d0a06 0%, #000 70%);
  transition:opacity 1s var(--ease), visibility 0s linear 1s;
  user-select:none; -webkit-user-select:none;
}
#splash.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
.splash-inner{ display:flex; flex-direction:column; align-items:center; gap:22px; transition:transform 1s var(--ease), filter 1s var(--ease); }
#splash.hidden .splash-inner{ transform:scale(1.18); filter:blur(10px); }
.splash-orn{ display:flex; align-items:center; gap:12px; }
.splash-orn i{ display:block; width:0; height:1px; background:linear-gradient(90deg,transparent,var(--gold)); animation:lineGrow 1.6s var(--ease) .2s forwards; }
.splash-orn i:last-child{ background:linear-gradient(270deg,transparent,var(--gold)); }
.splash-orn b{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 14px rgba(var(--gold-rgb),.8); animation:diamond 3s ease-in-out infinite; }
@keyframes lineGrow{ to{ width:clamp(50px,14vw,90px); } }
@keyframes diamond{ 0%,100%{ opacity:.45; transform:rotate(45deg) scale(.85);} 50%{ opacity:1; transform:rotate(45deg) scale(1.15);} }
.splash-text{
  font-family:var(--f-ar); font-weight:600; font-size:clamp(17px,2.6vw,21px);
  color:rgba(255,246,220,.9); text-shadow:0 0 22px rgba(var(--gold-rgb),.55);
  animation:pulseText 2.4s ease-in-out infinite;       /* بدون letter-spacing حتى ما تنفصل الحروف العربية */
}
@keyframes pulseText{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

/* ═══════════════════════════════════════════════════════════════
   2 · BACKGROUND
   ═══════════════════════════════════════════════════════════════ */
.bg{ position:fixed; inset:0; z-index:0; overflow:hidden; background:#000; }
#bg-video{
  position:absolute; top:50%; left:50%; width:100%; height:100%; object-fit:cover;
  transform:translate(-50%,-50%) scale(1.06);
  filter:grayscale(.9) sepia(.22) contrast(1.18) brightness(.52);
}
.bg-vignette{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(0,0,0,.05) 0%, rgba(0,0,0,.6) 70%, rgba(0,0,0,.92) 100%),
    linear-gradient(to bottom, rgba(0,0,0,.45) 0%, transparent 25%, transparent 55%, rgba(0,0,0,.78) 100%);
}
.bg-spot{                                  /* ضوء ناعم يتبع المؤشر */
  position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; opacity:.9;
  background:radial-gradient(520px circle at var(--mx) var(--my), rgba(var(--gold-rgb),.10), transparent 62%);
}
.bg-grain{
  position:absolute; inset:-50%; pointer-events:none; opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(6) infinite;
}
@keyframes grain{ 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }
#petals{ position:fixed; inset:0; z-index:1; width:100%; height:100%; pointer-events:none; }

/* ═══════════════════════════════════════════════════════════════
   MUTE (أعلى اليسار)
   ═══════════════════════════════════════════════════════════════ */
.audio-ctl{
  position:fixed; z-index:100; top:max(18px,env(safe-area-inset-top)); left:max(18px,env(safe-area-inset-left));
  display:flex; align-items:center; height:46px; padding:0 5px; border-radius:999px; direction:ltr;
  background:var(--glass); border:1px solid var(--line);
  backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3);
  transition:border-color .3s, box-shadow .3s;
}
.audio-ctl:hover{ border-color:rgba(var(--gold-rgb),.4); box-shadow:0 0 26px rgba(var(--gold-rgb),.15); }
#mute-btn{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--text); transition:color .2s, transform .2s; }
#mute-btn:hover{ color:var(--gold); transform:scale(1.1); }
#mute-btn svg{ width:19px; height:19px; }
.vol-wrap{ width:0; opacity:0; overflow:hidden; transition:width .35s var(--ease), opacity .25s, margin .35s var(--ease); }
.audio-ctl:hover .vol-wrap, .audio-ctl:focus-within .vol-wrap{ width:80px; opacity:1; margin:0 10px 0 4px; }

/* range (volume) */
.vol{ -webkit-appearance:none; appearance:none; width:100%; height:16px; background:transparent; cursor:pointer; --p:70%; }
.vol::-webkit-slider-runnable-track{ height:3px; border-radius:3px; background:linear-gradient(to right,var(--gold) var(--p),rgba(255,255,255,.2) var(--p)); }
.vol::-moz-range-track{ height:3px; border-radius:3px; background:rgba(255,255,255,.2); }
.vol::-moz-range-progress{ height:3px; border-radius:3px; background:var(--gold); }
.vol::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:11px; margin-top:-4px; border-radius:50%; background:#fff; border:0; box-shadow:0 0 8px rgba(var(--gold-rgb),.9); }
.vol::-moz-range-thumb{ width:11px; height:11px; border-radius:50%; background:#fff; border:0; box-shadow:0 0 8px rgba(var(--gold-rgb),.9); }

/* ═══════════════════════════════════════════════════════════════
   3 · PROFILE  (بدون صندوق — يطفو مباشرة فوق الفيديو)
   ═══════════════════════════════════════════════════════════════ */
.main{
  position:relative; z-index:10; width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  padding:24px 20px 170px; perspective:900px;
}
.profile{
  width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; text-align:center;
  transition:transform .35s ease-out; will-change:transform;
}

/* Reveal */
.rv{ opacity:0; transform:translateY(22px); filter:blur(8px); }
body.entered .rv{
  opacity:1; transform:none; filter:none;
  transition:opacity 1.1s var(--ease), transform 1.1s var(--ease), filter 1.1s var(--ease);
  transition-delay:calc(var(--i,0) * 110ms + 200ms);
}

/* Avatar — حلقة ذهبية دوّارة + توهّج نابض */
.avatar{ position:relative; width:132px; height:132px; margin-bottom:26px; border-radius:50%; animation:avGlow 3.4s ease-in-out infinite; }
.avatar::before{
  content:""; position:absolute; inset:-5px; border-radius:50%; padding:2.5px;
  background:conic-gradient(from var(--a,0deg), var(--gold-1), var(--gold-4), var(--gold-2), var(--gold-1) 40%, rgba(143,107,46,.15) 60%, var(--gold-3), var(--gold-1));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
  animation:ringSpin 6s linear infinite;
}
.avatar::after{                              /* حلقة خارجية رفيعة تتمدد */
  content:""; position:absolute; inset:-5px; border-radius:50%; border:1px solid rgba(var(--gold-rgb),.5);
  animation:ripple 3.4s ease-out infinite;
}
@property --a{ syntax:"<angle>"; inherits:false; initial-value:0deg; }
@keyframes ringSpin{ to{ --a:360deg; } }
@keyframes ripple{ 0%{ transform:scale(1); opacity:.7 } 100%{ transform:scale(1.55); opacity:0 } }
@keyframes avGlow{
  0%,100%{ box-shadow:0 0 26px rgba(var(--gold-rgb),.22), 0 0 60px rgba(var(--gold-rgb),.08); }
  50%    { box-shadow:0 0 42px rgba(var(--gold-rgb),.48), 0 0 96px rgba(var(--gold-rgb),.18); }
}
.avatar img{ position:relative; z-index:1; width:100%; height:100%; border-radius:50%; object-fit:cover; background:#111; border:4px solid #0a0806; }

/* الاسم */
.name{
  font-family:var(--f-display); font-weight:700; font-size:clamp(46px,12vw,64px); line-height:1.05; letter-spacing:.04em;
  background:linear-gradient(100deg,var(--gold-1) 0%,var(--gold-3) 25%,var(--gold-4) 40%,var(--gold-2) 60%,var(--gold-3) 78%,var(--gold-1) 100%);
  background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shine 7s ease-in-out infinite; filter:drop-shadow(0 4px 24px rgba(var(--gold-rgb),.28));
  direction:ltr;
}
@keyframes shine{ 0%,100%{ background-position:100% 0 } 50%{ background-position:0 0 } }

.bio{ margin-top:12px; font-size:clamp(15px,4vw,17px); font-weight:600; color:var(--text-2); }

.location{ margin-top:14px; display:inline-flex; align-items:center; gap:7px; padding:6px 15px; border-radius:999px; font-size:13px; font-weight:600; color:var(--text-2); border:1px solid var(--line); background:rgba(255,255,255,.03); }
.location svg{ width:14px; height:14px; color:var(--gold); filter:drop-shadow(0 0 6px rgba(var(--gold-rgb),.7)); animation:bob 2.4s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-2px) } }

/* فاصل زخرفي */
.orn{ display:flex; align-items:center; gap:12px; margin:30px 0 28px; width:min(260px,70%); }
.orn i{ flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(var(--gold-rgb),.55)); }
.orn i:last-child{ background:linear-gradient(270deg,transparent,rgba(var(--gold-rgb),.55)); }
.orn b{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 12px rgba(var(--gold-rgb),.8); }

/* ═══════════════════════════════════════════════════════════════
   4 · SOCIALS
   ═══════════════════════════════════════════════════════════════ */
.socials{ display:flex; gap:18px; justify-content:center; direction:ltr; }
.social{
  position:relative; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; color:var(--text);
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.12), rgba(255,255,255,.03));
  border:1px solid var(--line);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  transition:transform .4s var(--ease), color .3s, border-color .3s, box-shadow .4s, background .3s;
}
.social svg{ width:24px; height:24px; transition:filter .3s; }
.social::before{                              /* حلقة ذهبية تظهر عند التمرير */
  content:""; position:absolute; inset:-5px; border-radius:50%; border:1px solid rgba(var(--gold-rgb),.0); transform:scale(.85);
  transition:transform .45s var(--ease), border-color .4s;
}
.social:hover,.social:focus-visible{
  transform:translateY(-7px) scale(1.08); color:var(--gold-4);
  border-color:rgba(var(--gold-rgb),.65);
  background:radial-gradient(circle at 30% 25%, rgba(var(--gold-rgb),.28), rgba(var(--gold-rgb),.06));
  box-shadow:0 16px 36px rgba(0,0,0,.55), 0 0 30px rgba(var(--gold-rgb),.38);
}
.social:hover svg{ filter:drop-shadow(0 0 9px rgba(var(--gold-rgb),.95)); }
.social:hover::before,.social:focus-visible::before{ transform:scale(1); border-color:rgba(var(--gold-rgb),.3); }
.social:active{ transform:translateY(-3px) scale(1.02); }
.social::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 14px); left:50%; transform:translate(-50%,6px);
  padding:5px 11px; border-radius:8px; font:600 11px/1 var(--f-en); letter-spacing:.06em; white-space:nowrap; color:var(--gold-4);
  background:rgba(0,0,0,.85); border:1px solid var(--line); opacity:0; pointer-events:none; transition:opacity .25s, transform .3s var(--ease);
}
.social:hover::after,.social:focus-visible::after{ opacity:1; transform:translate(-50%,0); }

/* ═══════════════════════════════════════════════════════════════
   5 & 6 · DOCK  (المشاهدات + المشغّل)
   ═══════════════════════════════════════════════════════════════ */
.dock{
  position:fixed; z-index:90; left:0; right:0; margin:0 auto;
  bottom:max(22px,env(safe-area-inset-bottom)); width:min(470px,calc(100% - 28px));
  display:flex; flex-direction:column; align-items:center; gap:11px; direction:ltr;
}
.views{
  display:inline-flex; align-items:center; gap:8px; padding:6px 15px; border-radius:999px;
  font:500 12.5px/1 var(--f-en); letter-spacing:.06em; color:var(--text-2);
  background:var(--glass); border:1px solid var(--line);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.views svg{ width:14px; height:14px; color:var(--gold); }
.views b{ font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; }

.player{
  position:relative; width:100%; padding:13px 17px 11px; border-radius:24px;
  background:linear-gradient(180deg, rgba(22,17,11,.78), rgba(8,6,4,.84));
  border:1px solid var(--line);
  backdrop-filter:blur(24px) saturate(1.3); -webkit-backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:0 24px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.07);
  display:flex; flex-direction:column; gap:11px;
}
.player::before{                               /* خط ذهبي ناعم أعلى المشغّل */
  content:""; position:absolute; top:-1px; left:20%; right:20%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--gold-rgb),.8),transparent);
}
.p-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.track{ display:flex; align-items:center; gap:13px; min-width:0; }

/* غلاف دائري يلف مثل الأسطوانة */
.disc{
  position:relative; flex:0 0 auto; width:54px; height:54px; border-radius:50%; overflow:hidden; display:grid; place-items:center;
  background:repeating-radial-gradient(circle,#1b1610 0 2px,#0c0906 2px 4px);
  border:1px solid rgba(var(--gold-rgb),.35); box-shadow:0 6px 18px rgba(0,0,0,.6);
  animation:spin 7s linear infinite; animation-play-state:paused;
}
.player.playing .disc{ animation-play-state:running; box-shadow:0 6px 18px rgba(0,0,0,.6), 0 0 22px rgba(var(--gold-rgb),.3); }
@keyframes spin{ to{ transform:rotate(360deg); } }
.disc img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.disc .note{ width:18px; height:18px; color:var(--gold); }
.disc::after{                                  /* ثقب الأسطوانة */
  content:""; position:absolute; width:10px; height:10px; border-radius:50%; background:#080604; border:1.5px solid var(--gold-2);
  box-shadow:0 0 0 3px rgba(0,0,0,.35);
}
.disc img ~ .note{ display:none; }

.t-info{ display:flex; flex-direction:column; gap:4px; min-width:0; text-align:left; }
.t-title{ display:flex; align-items:center; gap:8px; font:600 14px/1.2 var(--f-en); color:var(--text); }
.t-title span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.t-artist{ font:400 12px/1.2 var(--f-en); color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.eq{ display:inline-flex; align-items:flex-end; gap:2px; height:11px; opacity:0; transition:opacity .3s; flex:0 0 auto; }
.eq i{ width:2.5px; height:3px; border-radius:2px; background:var(--gold); }
.player.playing .eq{ opacity:1; }
.player.playing .eq i{ animation:eq .9s ease-in-out infinite; }
.eq i:nth-child(2){ animation-delay:.2s !important; } .eq i:nth-child(3){ animation-delay:.45s !important; }
@keyframes eq{ 0%,100%{ height:3px } 50%{ height:11px } }

.ctrls{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
.cbtn{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--text-2); transition:color .2s, background .2s, transform .25s var(--ease); }
.cbtn:hover{ color:#fff; background:rgba(255,255,255,.08); transform:scale(1.1); }
.cbtn:active{ transform:scale(.9); }
.cbtn svg{ width:16px; height:16px; }
.cbtn.primary{
  width:46px; height:46px; color:#1a1206;
  background:linear-gradient(135deg,var(--gold-3),var(--gold-2) 55%,var(--gold-1));
  box-shadow:0 0 24px rgba(var(--gold-rgb),.4), inset 0 1px 0 rgba(255,255,255,.5);
}
.cbtn.primary:hover{ color:#1a1206; background:linear-gradient(135deg,var(--gold-4),var(--gold-3) 55%,var(--gold-2)); box-shadow:0 0 34px rgba(var(--gold-rgb),.62), inset 0 1px 0 rgba(255,255,255,.6); }
.cbtn.primary svg{ width:17px; height:17px; }

.p-prog{ display:flex; align-items:center; gap:11px; }
.time{ font:500 11.5px/1 var(--f-en); font-variant-numeric:tabular-nums; color:var(--text-3); min-width:32px; }
.time.end{ text-align:right; }
.bar{ position:relative; flex:1; height:18px; display:flex; align-items:center; cursor:pointer; touch-action:none; }
.track-line{ position:relative; width:100%; height:4px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; transition:height .2s; }
.bar:hover .track-line,.bar.drag .track-line{ height:6px; }
.fill{ position:absolute; inset:0; transform-origin:left center; transform:scaleX(0); border-radius:99px;
  background:linear-gradient(90deg,var(--gold-1),var(--gold-3)); box-shadow:0 0 12px rgba(var(--gold-rgb),.7); }
.thumb{ position:absolute; top:50%; left:0; width:13px; height:13px; margin:-6.5px 0 0 -6.5px; border-radius:50%; background:#fff;
  box-shadow:0 0 0 3px rgba(var(--gold-rgb),.35), 0 0 14px rgba(var(--gold-rgb),.9); transform:scale(0); transition:transform .2s var(--ease); pointer-events:none; }
.bar:hover .thumb,.bar.drag .thumb,.bar:focus-visible .thumb{ transform:scale(1); }
@media (hover:none){ .thumb{ transform:scale(1); } }

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════════ */
@media (max-width:480px){
  .avatar{ width:114px; height:114px; margin-bottom:22px; }
  .socials{ gap:14px; }
  .social{ width:54px; height:54px; }
  .vol-wrap{ display:none; }
  .dock{ bottom:max(14px,env(safe-area-inset-bottom)); }
  .player{ padding:11px 13px 10px; border-radius:22px; }
  .disc{ width:48px; height:48px; }
  .cbtn{ width:34px; height:34px; }
  .cbtn.primary{ width:43px; height:43px; }
  .main{ padding-bottom:160px; }
}
@media (max-height:640px){ .main{ align-items:flex-start; overflow-y:auto; } .avatar{ width:96px; height:96px; margin-bottom:16px; } .orn{ margin:18px 0 16px; } }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; transition-delay:0s !important; }
}
</style>
</head>

<body>

<!-- ═════════ 1 · SPLASH ═════════ -->
<div id="splash" role="button" tabindex="0" aria-label="دوس هنا">
  <div class="splash-inner">
    <div class="splash-orn"><i></i><b></b><i></i></div>
    <span class="splash-text">دوس هنا...</span>
  </div>
</div>

<!-- ═════════ 2 · BACKGROUND ═════════ -->
<div class="bg" aria-hidden="true">
  <!-- ▼ الفيديو: ضع ملفك باسم background.mp4 بجانب هذا الملف ▼ -->
  <video id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="bg-vignette"></div>
  <div class="bg-spot"></div>
  <div class="bg-grain"></div>
</div>
<canvas id="petals" aria-hidden="true"></canvas>

          <!-- ▼ غلاف الأغنية (اختياري): إذا الملف مو موجود يظهر رمز النوتة تلقائياً ▼ -->

          <svg class="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const audio = $('audio'), video = $('bg-video'), player = $('player');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── أيقونات ───────────────────────────────────────────────── */
  const ICON = {
    play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
    vol:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>',
    mute:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'
  };
  const playBtn = $('play'), muteBtn = $('mute-btn'), volume = $('volume');
  playBtn.innerHTML = ICON.play; muteBtn.innerHTML = ICON.vol;

  /* ── الصورة الشخصية: إذا avatar.png مو موجود جرّب الاسم البديل ── */
  const av = $('avatar-img');
  av.addEventListener('error', () => {
    if (!av.dataset.tried) { av.dataset.tried = 1; av.src = 'bc1qrn8tsns2yf0d9c3xunf28w3yhnmu3xw2gaf4wa.jpg'; }
  });

  /* ── المشاهدات (محفوظة بالمتصفح، +1 كل زيارة) ─────────────── */
  const BASE_VIEWS = 15420;
  let views = BASE_VIEWS + 1;
  try { views = parseInt(localStorage.getItem('iwaitx_views') || BASE_VIEWS, 10) + 1; localStorage.setItem('iwaitx_views', views); } catch (e) {}
  const nf = new Intl.NumberFormat('en-US');
  function countUp(el, to, ms) {
    if (reduce) { el.textContent = nf.format(to); return; }
    const t0 = performance.now() + 1200;
    (function step(now) {
      const p = Math.min(Math.max((now - t0) / ms, 0), 1);
      el.textContent = nf.format(Math.round(to * (1 - Math.pow(1 - p, 4))));
      if (p < 1) requestAnimationFrame(step);
    })(performance.now());
  }
  $('view-count').textContent = '0';

  /* ── الصوت ─────────────────────────────────────────────────── */
  audio.volume = .7;
  const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const setP = (el, v) => el.style.setProperty('--p', v + '%');
  function syncVol() {
    const v = audio.muted ? 0 : audio.volume;
    volume.value = v * 100; setP(volume, v * 100);
    muteBtn.innerHTML = v === 0 ? ICON.mute : ICON.vol;
  }
  syncVol(); setP(volume, 70);
  muteBtn.addEventListener('click', () => { audio.muted = !audio.muted; if (!audio.muted && audio.volume === 0) audio.volume = .7; syncVol(); });
  volume.addEventListener('input', () => { audio.volume = volume.value / 100; audio.muted = audio.volume === 0; syncVol(); });

  /* ── تشغيل / إيقاف ─────────────────────────────────────────── */
  let raf = 0;
  function setPlaying(on) {
    player.classList.toggle('playing', on);
    playBtn.innerHTML = on ? ICON.pause : ICON.play;
    cancelAnimationFrame(raf);
    if (on) loop(); else render();
  }
  audio.addEventListener('play',  () => setPlaying(true));
  audio.addEventListener('pause', () => setPlaying(false));
  const play = () => { const p = audio.play(); if (p && p.catch) p.catch(() => setPlaying(false)); };
  playBtn.addEventListener('click', () => audio.paused ? play() : audio.pause());
  $('prev').addEventListener('click', () => { audio.currentTime = 0; render(); });
  $('next').addEventListener('click', () => { if (audio.duration) { audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); render(); } });

  /* ── شريط التقدّم (سحب بالماوس/اللمس + كيبورد) ─────────────── */
  const bar = $('bar'), fill = $('fill'), thumb = $('thumb'), cur = $('cur'), dur = $('dur');
  let dragging = false, dragRatio = 0;
  function paint(ratio) {
    ratio = Math.min(Math.max(ratio, 0), 1);
    fill.style.transform = `scaleX(${ratio})`;
    thumb.style.left = (ratio * 100) + '%';
    return ratio;
  }
  function render() {
    const d = audio.duration;
    if (dragging) { paint(dragRatio); if (isFinite(d)) cur.textContent = fmt(dragRatio * d); return; }
    const r = isFinite(d) && d > 0 ? audio.currentTime / d : 0;
    paint(r); cur.textContent = fmt(audio.currentTime);
    bar.setAttribute('aria-valuenow', Math.round(r * 100));
  }
  function loop() { render(); raf = requestAnimationFrame(loop); }          // حركة ناعمة 60fps
  const ratioFrom = e => { const r = bar.getBoundingClientRect(); return Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1); };
  bar.addEventListener('pointerdown', e => { dragging = true; bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); dragRatio = ratioFrom(e); render(); });
  bar.addEventListener('pointermove', e => { if (dragging) { dragRatio = ratioFrom(e); render(); } });
  const endDrag = e => {
    if (!dragging) return;
    dragging = false; bar.classList.remove('drag');
    if (isFinite(audio.duration)) audio.currentTime = dragRatio * audio.duration;
    render();
  };
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
  bar.addEventListener('keydown', e => {
    if (!isFinite(audio.duration)) return;
    const k = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (k) { e.preventDefault(); audio.currentTime = Math.min(Math.max(audio.currentTime + k, 0), audio.duration); render(); }
    if (e.key === 'Home') { audio.currentTime = 0; render(); }
    if (e.key === 'End')  { audio.currentTime = audio.duration - .1; render(); }
  });
  const onMeta = () => { dur.textContent = fmt(audio.duration); render(); };
  audio.addEventListener('loadedmetadata', onMeta);
  audio.addEventListener('durationchange', onMeta);
  audio.addEventListener('seeked', render);
  audio.addEventListener('timeupdate', () => { if (audio.paused) render(); });
  if (audio.readyState >= 1) onMeta();

  /* ── اختصارات الكيبورد ─────────────────────────────────────── */
  addEventListener('keydown', e => {
    if (!document.body.classList.contains('entered') || e.target.closest('input,button,a,[role=slider]')) return;
    if (e.code === 'Space') { e.preventDefault(); audio.paused ? play() : audio.pause(); }
    if (e.key === 'm' || e.key === 'M') muteBtn.click();
  });

  /* ── 1 · الدخول (الضغطة تتخطى قيود التشغيل التلقائي) ───────── */
  const splash = $('splash'); let entered = false;
  function enter() {
    if (entered) return; entered = true;
    splash.classList.add('hidden');
    document.body.classList.add('entered');
    const v = video.play(); if (v && v.catch) v.catch(() => {});
    play();
    countUp($('view-count'), views, 1800);
    setTimeout(() => splash.remove(), 1300);
  }
  splash.addEventListener('click', enter);
  splash.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });

  /* ── ضوء يتبع المؤشر + ميلان خفيف ─────────────────────────── */
  const profile = $('profile');
  if (!reduce && matchMedia('(hover:hover) and (pointer:fine)').matches) {
    addEventListener('pointermove', e => {
      const x = e.clientX / innerWidth, y = e.clientY / innerHeight;
      document.documentElement.style.setProperty('--mx', (x * 100) + '%');
      document.documentElement.style.setProperty('--my', (y * 100) + '%');
      profile.style.transform = `rotateX(${((.5 - y) * 5).toFixed(2)}deg) rotateY(${((x - .5) * 6).toFixed(2)}deg)`;
    });
  }

  /* ── بتلات الورد المتساقطة (ذهبية + ياقوتية) ───────────────── */
  (function petals() {
    if (reduce) return;
    const c = $('petals'), ctx = c.getContext('2d');
    let W, H, dpr;
    const COLORS = ['255,236,184', '230,199,122', '255,246,220', '196,40,60', '230,199,122', '255,236,184'];
    const resize = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; };
    resize(); addEventListener('resize', resize);

    class Petal {
      constructor(initial) { this.reset(initial); }
      reset(initial) {
        const depth = Math.random();                       // 0 = بعيد · 1 = قريب
        this.s   = (5 + depth * 11) * dpr;
        this.x   = Math.random() * W;
        this.y   = initial ? Math.random() * H : -this.s * 2;
        this.vy  = (.35 + depth * 1.05) * dpr;
        this.vx  = (Math.random() - .5) * .4 * dpr;
        this.rot = Math.random() * 6.28;  this.vr = (Math.random() - .5) * .03;
        this.fl  = Math.random() * 6.28;  this.vf = .015 + Math.random() * .03;
        this.sw  = Math.random() * 6.28;
        this.a   = .22 + depth * .5;
        this.col = COLORS[(Math.random() * COLORS.length) | 0];
      }
      step() {
        this.y += this.vy; this.sw += .012;
        this.x += this.vx + Math.sin(this.sw) * .5 * dpr;
        this.rot += this.vr; this.fl += this.vf;
        if (this.y > H + this.s * 2) this.reset(false);
      }
      draw() {
        const s = this.s, k = Math.cos(this.fl);               // تقلّب ثلاثي الأبعاد
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot); ctx.scale(Math.max(Math.abs(k), .15), 1);
        ctx.globalAlpha = this.a;
        const g = ctx.createLinearGradient(0, -s, 0, s);
        g.addColorStop(0, `rgba(${this.col},1)`); g.addColorStop(1, `rgba(${this.col},.35)`);
        ctx.fillStyle = g; ctx.shadowColor = `rgba(${this.col},.7)`; ctx.shadowBlur = 8 * dpr;
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.bezierCurveTo(s * .95, -s * .55, s * .85, s * .6, 0, s);
        ctx.bezierCurveTo(-s * .85, s * .6, -s * .95, -s * .55, 0, -s);
        ctx.fill(); ctx.restore();
      }
    }
    const N = innerWidth < 600 ? 16 : 28;
    const list = Array.from({ length: N }, () => new Petal(true));
    (function frame() { ctx.clearRect(0, 0, W, H); list.forEach(p => { p.step(); p.draw(); }); requestAnimationFrame(frame); })();
  })();
})();
</script>
